[tox]
envlist = py{311,312,313,314,315}{,-beartype}, pypy{311,312}
isolated_build = true

[testenv]
runner = uv-venv-lock-runner
commands =
    pytest -m 'not benchmark' {posargs}
dependency_groups =
    !beartype-!pypy311-!pypy312: test
    beartype-!pypy311-!pypy312: test-beartype
    pypy311,pypy312: test-pypy
package = editable
