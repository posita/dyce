repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        # See <https://docs.python.org/3/library/re.html#re.X>
        exclude: |
          (?x)^(
            uv\.lock
          )$
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-yaml
        args: [--unsafe]
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
        # See <https://docs.python.org/3/library/re.html#re.X>
        exclude: |
          (?x)^(
            docs/(
              dyce-powered\.svg|
              assets/perf_.*\.txt|
              assets/plot_.*\.svg
            )
          )$
      - id: trailing-whitespace
        # See <https://docs.python.org/3/library/re.html#re.X>
        exclude: |
          (?x)^(
            docs/(
              dyce-powered\.svg|
              assets/perf_.*\.txt|
              assets/plot_.*\.svg
            )
          )$

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.19
    hooks:
      - id: uv-lock

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/google/osv-scanner
    rev: v2.6.0
    hooks:
      - id: osv-scanner

  - repo: https://github.com/semgrep/pre-commit
    rev: v1.178.0
    hooks:
      - id: semgrep-ci

  # - repo: https://github.com/mxab/pre-commit-trivy
  #   rev: 0.74.0
  #   hooks:
  #     - id: trivyfs-docker
  #       entry: docker.io/aquasec/trivy:0.74.0 fs --cache-dir /src/.pre-commit-trivy-cache --exit-code 1
  #       args: [.]
  #     - id: trivyconfig-docker
  #       entry: docker.io/aquasec/trivy:0.74.0 config --cache-dir /src/.pre-commit-trivy-cache --exit-code 1
  #       args: [.]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: [--toml, pyproject.toml]
        additional_dependencies:
          - tomli

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        entry: ruff check
        args: [--fix]
      - id: ruff-format
        entry: ruff format

  - repo: meta
    hooks:
    - id: check-useless-excludes

  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: ty
        args: [check]
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: zuban
        name: zuban
        entry: zuban
        args: [check]
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: pyright
        name: pyright
        entry: pyright
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: check-doctests-check
        name: check-doctests-check
        entry: ./helpers/check-doctests.py
        args: [check]
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: check-doctests-format
        name: check-doctests-format
        entry: ./helpers/check-doctests.py
        args: [format]
        language: system
        pass_filenames: false
        stages: [pre-push]
