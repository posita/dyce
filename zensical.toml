[project]
site_name = "dyce"
site_description = "Simple Python tools for exploring dice outcomes and other finite discrete probabilities"
site_author = "Matt Bogosian"
copyright = """<i>Copyright and other protections apply.
  Please see the accompanying <tt>LICENSE</tt> file for rights and restrictions governing use of this software.
  All rights not expressly waived or licensed are reserved.
  If that file is missing or appears to be modified from its original, then please contact the author before viewing or using this software in any capacity.</i>"""
docs_dir = "docs"
repo_url = "https://github.com/posita/dyce/"
watch = [
  "LICENSE",
  "README.md",
  "_griffe_ext.py",
  "docs",
  "docs-src",
  "dyce",
  "jupyter-lite.json",
  "jupyter_lite_config.json",
  "zensical.toml",
]

# ---- BEGIN MathJax config ----
extra_javascript = ["https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"]
# ----- END MathJax config -----

nav = [
  { Introduction = "index.md" },
  { "Core concepts" = "concepts.md" },
  { "Examples" = "examples.md" },
  { "Release notes" = "notes.md" },
  { Contributing = "contrib.md" },
  { "License and credits" = "license.md" },
  { API = [
    # dyce.lifecycle, dyce.rng, and dyce.types are internal and
    # intentionally excluded from the published API navigation
    { Core = "dyce.md" },
    { Conveniences = "dyce.d.md" },
    { Visualization = [
      { "Shared structures" = "dyce.viz.md" },
      { "Matplotlib (optional)" = "dyce.viz.matplotlib.md" },
      { Plotly = "dyce.viz.plotly.md" },
    ] },
  ] },
  { Glossary = "glossary.md" }
]

[project.theme]
name = "material"
custom_dir = "overrides"
features = [
  "content.code.annotate",
  "content.tabs.link",
  "navigation.footer",
  "navigation.expand",
  "navigation.sections",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "material/brightness-auto"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "green"
accent = "green"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "light-green"
accent = "light-green"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to system preference"

[project.extra.version]
provider = "mike"

[project.plugins.mkdocstrings.handlers.python]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
extensions = ["griffe_warnings_deprecated", "_griffe_ext.py:LifecycleExtension"]
show_signature_annotations = true

[project.markdown_extensions]
admonition = {}
footnotes = {}
pycon = {}
pymdownx.arithmatex = { generic = true, block_tag = "pre" }
pymdownx.details = {}
pymdownx.emoji = { emoji_generator = "zensical.extensions.emoji.to_svg", emoji_index = "zensical.extensions.emoji.twemoji" }
pymdownx.highlight = { default_lang = "python", linenums = true }
pymdownx.snippets = { dedent_subsections = true, check_paths = true }
pymdownx.tabbed.alternate_style = true
pymdownx.tilde = {}
# Support `#!math ...` inline syntax
pymdownx.inlinehilite.custom_inline = [
  { name = "math", class = "arithmatex", format = { object = "pymdownx.arithmatex.arithmatex_inline_format", kwds = { mode = "generic" } } },
]
# Support ```math ...``` fence syntax
pymdownx.superfences.custom_fences = [
  { name = "math", class = "arithmatex", format = { object = "pymdownx.arithmatex.arithmatex_fenced_format", kwds = { mode = "generic", tag = "pre" } } },
]
