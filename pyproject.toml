[project]
name = "dyce"
dynamic = ["version"]
description = "Simple Python tools for exploring dice outcomes and other finite discrete probabilities"
readme = {file = "README.md", content-type = "text/markdown; charset=UTF-8"}
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Matt Bogosian", email = "matt@bogosian.net"}]
requires-python = ">=3.11"
dependencies = [
    "optype",
    "typing_extensions>=4.5; python_version < '3.13'",  # back-port of deprecated decorator
]
classifiers = [
  "Topic :: Education",
  "Topic :: Games/Entertainment",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]

[project.urls]
Homepage = "https://posita.github.io/dyce/"
"Source Repository" = "https://github.com/posita/dyce/"

[project.optional-dependencies]
viz = ["matplotlib"]

[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dyce"]
package-data = {"dyce" = ["py.typed"]}

[tool.setuptools_scm]
fallback_version = "0.0.0+unknown"

[dependency-groups]
dev = [
    "ipython",
    {include-group = "docs"},
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "tox"},
    {include-group = "viz"},
]
# Only what's needed for uv run mkdocs build
docs = [
    "click>=8.3.2",  # see <https://github.com/mkdocs/mkdocs/issues/4032>
    "griffe-warnings-deprecated",
    "jupyter-server",
    "jupyterlab-server",
    "jupyterlab-widgets",
    "jupytext",
    "jupyterlite",
    "jupyterlite-pyodide-kernel",
    "markdown-pycon",  # syntax highlighting for doctests
    "mike",
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "numpy",
    "pandas",
    "pandas-stubs",
    "pymdown-extensions",
    "sympy",
    {include-group = "viz"},
]
# Only what's needed for uv run pre-commit run --all-files --hook-stage pre-push
lint = [
    "matplotlib_inline",
    "mypy",
    "pre-commit",
    "pre-commit-uv",
    "pyrefly",
    "pyright",
    "pytest",
    "ruff",
    "ty>=0.0.70",  # TODO(posita): https://github.com/astral-sh/ty/issues/4222
    {include-group = "docs"},
]
# Only what's needed for uv run pytest --cov
test = [
    "coverage[toml]",
    "numpy",
    "pandas",
    "pytest-benchmark",
    "pytest-cov",
    {include-group = "test-pypy"},
    {include-group = "viz"},
]
test-beartype = [
    "beartype>=0.23.0rc0",
    {include-group = "test"},
]
# Only what's needed for uv run pytest specifically with PyPy (via Tox)
test-pypy = [
    "griffe-warnings-deprecated",
    "ipdb",
    "pytest",
    "sympy",
]
# Only what's needed for uv run tox [-e ...]
tox = [
    "tox",
    "tox-uv",
]
# Mirrors optional dependencies
viz = ["matplotlib"]

[tool.codespell]
ignore-words-list = "CanGe,countin,ot,rollin"
skip = ["*.ipynb"]

[tool.coverage.run]
source = ["dyce"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.mypy]
files = ["docs", "dyce", "helpers", "tests", "*.py"]
# exclude = """(?x)(
#     ^docs/assets/nb_.*\\.py$
# )"""
exclude_gitignore = true
python_version = "3.11"
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pyrefly]
project-includes = ["docs", "dyce", "helpers", "tests", "*.py"]
python-version = "3.11.0"
infer-with-first-use = false

[warnings]
unused-ignore = true

[tool.pyright]
include = ["docs", "dyce", "helpers", "tests", "*.py"]
pythonVersion = "3.11"
reportUnnecessaryTypeIgnoreComment = "warning"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
addopts = [
  "--doctest-glob=*.md",
  "--doctest-modules",
  "--durations=4",
  "--pdbcls=IPython.terminal.debugger:TerminalPdb",
]
doctest_optionflags = [
  # See <https://docs.python.org/3/library/doctest.html#option-flags>
  "ELLIPSIS",
  "IGNORE_EXCEPTION_DETAIL",
  "NORMALIZE_WHITESPACE",
  # See also <https://docs.pytest.org/en/stable/how-to/doctest.html#using-doctest-options>
  "NUMBER",
]
testpaths = ["README.md", "docs", "dyce", "helpers", "tests", "*.py"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint.per-file-ignores]
"docs/assets/nb_*.py" = [
  # Cells support `await` statements
  "await-outside-async",
  "yield-outside-function",
  # ruff is confused by jupytext comments
  "commented-out-code",
  # Allow co-mingled imports for snippets
  "module-import-not-at-top-of-file",
  # Useful for cell display
  "print",
  "useless-expression",
  # Catch-all for things that are only ignored in these files
  "unused-noqa",
]
"docs/assets/plot_*.py" = [
  # Allow co-mingled imports for snippets
  "module-import-not-at-top-of-file",
  # Useful for cell display
  "print",
  "useless-expression",
]
"docs/notebooks/*.ipynb" = [
  # Allow co-mingled imports for snippets
  "module-import-not-at-top-of-file",
  # Useful for cell display
  "print",
  "useless-expression",
]

[tool.ruff.lint]
preview = true
ignore = [
  "CPY",
  "D",
  "DOC",
  "EM",
  "FIX",  # TODO(posita): run occasionally, or figure out how to make these warnings
  "PLC",
  "PLR",
  "ambiguous-unicode-character-docstring",
  "assert",
  "implicit-namespace-package",
  "line-too-long",
  "missing-trailing-comma",
  "non-empty-init-module",
  "non-lowercase-variable-in-function",
  "raise-vanilla-args",
  "superfluous-else-continue",
  "superfluous-else-raise",
  "superfluous-else-return",
  "suspicious-non-cryptographic-random-usage",
]
select = [
  "ALL",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  # TODO(posita): <https://github.com/astral-sh/ruff/issues/16536> -
  # NamedTuples are not mutable
  "dyce.h._QuantizeContext",
]

[tool.ty.src]
include = ["docs", "dyce", "helpers", "tests", "*.py"]
exclude = ["docs/assets/nb_*.py"]

[tool.check_doctests]
# log_level = "DEBUG"

[tool.check_doctests.check]
checkers = [
  # TODO(posita): See:
  # - <https://github.com/facebook/pyrefly/issues/3313>
  # - <https://github.com/astral-sh/ty/issues/3415>
  # ["ty", "check"],
  ["pyrefly", "check", "--search-path", "."],
  ["pyright"],
  ["mypy"],
]
fail_fast = false
