name: publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # required for setuptools-scm
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          cache-python: true
      - run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write  # required for trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    # Deliberately uses setup-python + pip (not setup-uv + uv pip) so
    # the verification path mirrors what downstream users actually run
    # when they `pip install dyce`. uv pip install is highly
    # compatible but not identical. Resolver behavior, pre-release
    # semantics, and sdist build paths can diverge. This is the one
    # place where matching the canonical end-user install path matters
    # more than tooling consistency with the rest of CI.
    needs: publish-testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # required for setuptools-scm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
      - name: install from TestPyPI (retry for index propagation)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for i in {1..45}; do
            if pip install \
                --index-url 'https://test.pypi.org/simple/' \
                --extra-index-url 'https://pypi.org/simple/' \
                "dyce==${VERSION}" ; then
              break
            fi
            sleep 2
          done
      - name: verify installed version matches tag
        run: |
          INSTALLED=$(python -c "import importlib.metadata; print(importlib.metadata.version('dyce'))")
          EXPECTED="${GITHUB_REF_NAME#v}"
          test "$INSTALLED" = "$EXPECTED" || {
            echo "installed=$INSTALLED expected=$EXPECTED"
            exit 1
          }

  publish-pypi:
    needs: verify-testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-github:
    needs: publish-pypi
    runs-on: ubuntu-latest
    # GitHub has no release-specific permission. Keep this job minimal because
    # contents: write also permits broader repository mutations.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(
            "$GITHUB_REF_NAME"
            dist/*
            --verify-tag
            --generate-notes
          )

          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]]; then
            args+=(--prerelease --latest=false)
          fi

          gh release create "${args[@]}"
